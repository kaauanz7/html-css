<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de Formulário</h1>

    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required minlength="5" maxlength="15" placeholder="Nome do Usuário" autocomplete="name">
        </p>

        <p>
            <label for="ano">Periodo:</label>
            <input type="month" id="ano" name="ano" min="2023-02" placeholder="Periodo">
        </p>

        <p>
            <label for="dia">Dia da Prova:</label>
            <input type="date" min="2023-02-01" id="dia" name="dia" required>
        </p>

        <p>
            <label for="media">Média:</label>
            <input type="number" id="media" name="media" step="0.1" min="0" max="10" placeholder="Média">
        </p> 

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">

    </form>
</body>
</html>

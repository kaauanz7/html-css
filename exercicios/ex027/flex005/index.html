<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: aquamarine;
        }
        main {
            background-color: yellow;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-flow: row nowrap;
        }
        section {
            background-color: royalblue;
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <main>
        <section><h1>Tela de Login</h1></section>
    </main>
</body>
</html>
